flow_start_time:

concurrency_groups:
  copy_raw_serial:
    limit: 1

flows:
  copy_raw:
    deployment_name: copy-raw-cps-test
    inject_time_offset: true
    concurrency_group: copy_raw_serial

  raw2Sv:
    flow: raw2Sv_CPS
    deployment_name: raw2Sv-cps-test
    interval: 5
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW

  simulate_transects:
    deployment_name: simulate-transects-cps-test
    interval: 3

  process_CPS:
    deployment_name: process-CPS-cps-test
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW
      grace_period_seconds: 3600

    triggers:
      - expect: "echodataflow.transect.updated"
        resource_name: "transect-monitor"
        resource_scope: related

      - expect: "prefect.flow-run.Completed"
        resource_name: "raw2Sv-cps-test"
        resource_scope: related

  update_cache_CPS:
    deployment_name: update-cache-CPS-cps-test
    interval: 1
    deployment_concurrency:
      limit: 1
      collision_strategy: CANCEL_NEW